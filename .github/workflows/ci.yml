name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Installer validation
        run: |
          bash -n scripts/install-private-relay.sh
          bash scripts/install-private-relay.sh --control-url https://control.example.com --hostname relay.example.com --dry-run
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        run: go test -race ./... -count=1
      - name: Isolated installer
        run: bash scripts/test-private-relay-installer.sh
